openapi: 3.0.3
info:
  title: Universities API
  version: 1.0.0
  description: Search and retrieve university metadata.
servers:
  - url: /v1
paths:
  /universities:
    get:
      summary: List universities
      parameters:
        - in: query
          name: country
          schema: { type: string }
        - in: query
          name: name
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Paginated university list
  /universities/{id}:
    get:
      summary: Get university by id
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: University
        "404":
          description: Not found

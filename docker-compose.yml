services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: studentapi
      POSTGRES_PASSWORD: studentapi
      POSTGRES_DB: studentapi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      MOCK_MODE: "true"
      DATABASE_URL: postgresql+asyncpg://studentapi:studentapi@postgres:5432/studentapi
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      API_BASE_URL: http://localhost:8000
      FRONTEND_URL: http://localhost:3000
      API_KEY_PEPPER: local-dev-pepper-change-me
      SECRET_KEY: local-dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
